name: Release

# Push a tag equal to manifest.json "version" (e.g. 0.1.0) to publish a release
# with the three files Obsidian/BRAT install: main.js, manifest.json, styles.css.
on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" main.js manifest.json styles.css --title "$tag" --generate-notes
